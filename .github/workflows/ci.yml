name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AUDIO_ENV: test
      AUDIO_AUTH_SECRET: ci-auth-secret-0123456789abcdef0123456789abcdef
      AUDIO_CAPABILITY_SECRET: ci-cap-secret-0123456789abcdef0123456789abcdef
      AUDIO_WATERMARK_SECRET: ci-wm-secret-0123456789abcdef0123456789abcdef
      AUDIO_SEGMENT_KEY_SECRET: ci-key-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg (ingest tests need it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: python_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        working-directory: python_service
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t oxiverse-audio:ci .
